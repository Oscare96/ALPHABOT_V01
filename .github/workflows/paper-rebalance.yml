name: ALPHABOT automatic paper rebalance

on:
  schedule:
    # Three chances each weekday, during US market hours in both DST seasons.
    - cron: '23 15,17,19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alphabot-paper-weekly
  cancel-in-progress: false

jobs:
  paper-rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_PAPER_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Attempt paper-only weekly rebalance
        run: |
          test -n "$ALPACA_API_KEY" && test -n "$ALPACA_SECRET_KEY"
          python -m scripts.auto_paper
