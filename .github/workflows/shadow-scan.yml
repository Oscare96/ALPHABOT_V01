name: Strategy shadow scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate shadow report
        run: python -m scripts.shadow_scan > shadow-scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-scan-${{ github.run_id }}
          path: shadow-scan.json
          retention-days: 90
